<svg width="100%" viewBox="0 0 680 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Where session state lives: camps 1-3 keep it on the server; our design moves it to the client">
<style>
  text{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;}
  .t{font-size:14px;} .ts{font-size:12px;} .th{font-size:14px;font-weight:600;} .sec{font-size:14px;font-weight:600;}
</style>
<defs><marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="460" fill="#FCFCFB"/>

<text class="sec" x="40" y="30" fill="#2C2C2A" text-anchor="start">Camps 1–3 — state lives on the server</text>

<rect x="40" y="46" width="150" height="52" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/>
<text class="th" x="115" y="66" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Dumb client</text>
<text class="ts" x="115" y="84" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">bytes in / out</text>

<rect x="230" y="46" width="170" height="52" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/>
<text class="th" x="315" y="66" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Proxy hop(s)</text>
<text class="ts" x="315" y="84" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">telnet · ws · ws→ws</text>

<rect x="440" y="46" width="200" height="52" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="0.8"/>
<text class="th" x="540" y="66" fill="#4A1B0C" text-anchor="middle" dominant-baseline="central">Stateful session</text>
<text class="ts" x="540" y="84" fill="#993C1D" text-anchor="middle" dominant-baseline="central">holds cursor + view</text>

<line x1="190" y1="72" x2="228" y2="72" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow2)"/>
<line x1="400" y1="72" x2="438" y2="72" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow2)"/>

<line x1="40" y1="118" x2="640" y2="118" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 4"/>

<text class="sec" x="40" y="146" fill="#2C2C2A" text-anchor="start">Ours — state moves to the client</text>

<text class="t" x="40" y="176" fill="#185FA5" text-anchor="start">Web — near-zero proxy</text>
<rect x="40" y="192" width="260" height="56" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.8"/>
<text class="th" x="170" y="212" fill="#0C447C" text-anchor="middle" dominant-baseline="central">Browser = the client</text>
<text class="ts" x="170" y="230" fill="#185FA5" text-anchor="middle" dominant-baseline="central">holds cursor · view · scroll</text>

<rect x="380" y="192" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.8"/>
<text class="th" x="510" y="212" fill="#085041" text-anchor="middle" dominant-baseline="central">Server</text>
<text class="ts" x="510" y="230" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">auth + push events only</text>

<line x1="300" y1="212" x2="378" y2="212" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow2)"/>
<line x1="378" y1="234" x2="300" y2="234" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow2)"/>
<text class="ts" x="339" y="203" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">commands</text>
<text class="ts" x="339" y="243" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">events</text>

<text class="t" x="40" y="292" fill="#0F6E56" text-anchor="start">SSH — thin client, one hop in</text>
<rect x="40" y="308" width="150" height="52" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/>
<text class="th" x="115" y="328" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Dumb terminal</text>
<text class="ts" x="115" y="346" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">bytes in / out</text>

<rect x="230" y="298" width="410" height="74" rx="12" fill="#EAF6F1" stroke="#1D9E75" stroke-width="0.8"/>
<text class="th" x="435" y="315" fill="#085041" text-anchor="middle" dominant-baseline="central">Server</text>
<rect x="250" y="328" width="180" height="34" rx="6" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.8"/>
<text class="ts" x="340" y="345" fill="#0C447C" text-anchor="middle" dominant-baseline="central">TUI = client · holds state</text>
<rect x="446" y="328" width="176" height="34" rx="6" fill="#FAECE7" stroke="#D85A30" stroke-width="0.8"/>
<text class="ts" x="534" y="345" fill="#4A1B0C" text-anchor="middle" dominant-baseline="central">event bus · push</text>

<line x1="190" y1="334" x2="248" y2="345" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow2)"/>
<text class="ts" x="210" y="322" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">ANSI</text>

<text class="ts" x="40" y="402" fill="#5F5E5A" text-anchor="start">The client is the same small program in both rows — it just renders DOM or ANSI.</text>
<text class="ts" x="40" y="424" fill="#5F5E5A" text-anchor="start">SSH can't be as thin as the browser only because the terminal can't hold state.</text>
</svg>
