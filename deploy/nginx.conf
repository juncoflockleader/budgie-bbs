events {}

http {
    # Round-robin across the API nodes with passive health checks. A node that
    # fails 3 times in 10s is taken out of rotation until it recovers.
    upstream budgie_api {
        server api1:8080 max_fails=3 fail_timeout=10s;
        server api2:8080 max_fails=3 fail_timeout=10s;
    }

    # WebSocket upgrade handling.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;

        # No sticky sessions: any request can go to any API node. Reconnect and
        # cursor replay handle anything missed on failover.
        location / {
            proxy_pass http://budgie_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # WebSocket + long-lived SSE.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 1h;
            proxy_buffering off;
        }
    }
}
