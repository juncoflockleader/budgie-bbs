<svg width="100%" viewBox="0 0 680 510" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Protocol-first architecture: two clients as peers of an append-only event log">
<style>
  text{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;}
  .t{font-size:14px;} .ts{font-size:12px;} .th{font-size:14px;font-weight:600;}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="510" fill="#FCFCFB"/>

<rect x="50" y="40" width="250" height="64" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.8"/>
<text class="th" x="175" y="64" fill="#085041" text-anchor="middle" dominant-baseline="central">Terminal client (SSH)</text>
<text class="ts" x="175" y="84" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">server-hosted TUI · renders ANSI</text>

<rect x="380" y="40" width="250" height="64" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.8"/>
<text class="th" x="505" y="64" fill="#0C447C" text-anchor="middle" dominant-baseline="central">Web client (WebSocket)</text>
<text class="ts" x="505" y="84" fill="#185FA5" text-anchor="middle" dominant-baseline="central">web-native UI · renders DOM</text>

<line x1="155" y1="104" x2="155" y2="182" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="195" y1="182" x2="195" y2="104" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="118" y="143" fill="#5F5E5A" text-anchor="end" dominant-baseline="central">commands</text>
<text class="ts" x="232" y="143" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">events</text>

<line x1="485" y1="104" x2="485" y2="182" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="525" y1="182" x2="525" y2="104" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="448" y="143" fill="#5F5E5A" text-anchor="end" dominant-baseline="central">commands</text>
<text class="ts" x="562" y="143" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">events</text>

<rect x="50" y="184" width="580" height="300" rx="20" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/>
<text class="th" x="80" y="210" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Server core</text>
<text class="ts" x="80" y="228" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">single source of truth · near-stateless per connection</text>

<rect x="80" y="252" width="220" height="56" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.8"/>
<text class="th" x="190" y="272" fill="#26215C" text-anchor="middle" dominant-baseline="central">Command handler</text>
<text class="ts" x="190" y="290" fill="#534AB7" text-anchor="middle" dominant-baseline="central">validates · applies · appends</text>

<rect x="380" y="252" width="220" height="56" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="0.8"/>
<text class="th" x="490" y="272" fill="#4A1B0C" text-anchor="middle" dominant-baseline="central">Pub/sub broadcaster</text>
<text class="ts" x="490" y="290" fill="#993C1D" text-anchor="middle" dominant-baseline="central">fans events to clients</text>

<line x1="300" y1="280" x2="378" y2="280" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="80" y="340" width="520" height="120" rx="12" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.8"/>
<text class="th" x="340" y="362" fill="#412402" text-anchor="middle" dominant-baseline="central">Append-only event log</text>
<text class="ts" x="340" y="382" fill="#854F0B" text-anchor="middle" dominant-baseline="central">ordered · immutable · every client holds a cursor</text>

<rect x="104" y="402" width="98" height="40" rx="6" fill="#FAC775" stroke="#BA7517" stroke-width="0.6"/>
<text class="ts" x="153" y="422" fill="#412402" text-anchor="middle" dominant-baseline="central">post.appended</text>
<rect x="212" y="402" width="90" height="40" rx="6" fill="#FAC775" stroke="#BA7517" stroke-width="0.6"/>
<text class="ts" x="257" y="422" fill="#412402" text-anchor="middle" dominant-baseline="central">thread.new</text>
<rect x="312" y="402" width="98" height="40" rx="6" fill="#FAC775" stroke="#BA7517" stroke-width="0.6"/>
<text class="ts" x="361" y="422" fill="#412402" text-anchor="middle" dominant-baseline="central">post.redacted</text>
<rect x="420" y="402" width="90" height="40" rx="6" fill="#FAC775" stroke="#BA7517" stroke-width="0.6"/>
<text class="ts" x="465" y="422" fill="#412402" text-anchor="middle" dominant-baseline="central">user.joined</text>
<rect x="520" y="402" width="56" height="40" rx="6" fill="#FAC775" stroke="#BA7517" stroke-width="0.6"/>
<text class="ts" x="548" y="422" fill="#412402" text-anchor="middle" dominant-baseline="central">…</text>

<line x1="190" y1="308" x2="190" y2="338" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="430" y1="338" x2="430" y2="308" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
