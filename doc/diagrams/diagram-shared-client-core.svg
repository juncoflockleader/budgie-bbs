<svg width="100%" viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="One shared client core, imported by two thin renderers producing DOM and ANSI">
<style>
  text{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;}
  .t{font-size:14px;} .ts{font-size:12px;} .th{font-size:14px;font-weight:600;}
</style>
<defs><marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="360" fill="#FCFCFB"/>

<rect x="190" y="36" width="300" height="64" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.8"/>
<text class="th" x="340" y="60" fill="#26215C" text-anchor="middle" dominant-baseline="central">Client core (shared library)</text>
<text class="ts" x="340" y="82" fill="#534AB7" text-anchor="middle" dominant-baseline="central">cursor · view state · commands · event folding</text>

<line x1="290" y1="100" x2="210" y2="158" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow3)"/>
<line x1="390" y1="100" x2="470" y2="158" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow3)"/>

<rect x="90" y="160" width="230" height="60" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.8"/>
<text class="th" x="205" y="182" fill="#0C447C" text-anchor="middle" dominant-baseline="central">Browser client</text>
<text class="ts" x="205" y="202" fill="#185FA5" text-anchor="middle" dominant-baseline="central">renders DOM</text>

<rect x="360" y="160" width="230" height="60" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.8"/>
<text class="th" x="475" y="182" fill="#085041" text-anchor="middle" dominant-baseline="central">Server-hosted TUI</text>
<text class="ts" x="475" y="202" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">renders ANSI</text>

<line x1="205" y1="220" x2="205" y2="266" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow3)"/>
<line x1="475" y1="220" x2="475" y2="266" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow3)"/>

<rect x="120" y="268" width="170" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/>
<text class="t" x="205" y="290" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Web UI (browser)</text>

<rect x="390" y="268" width="170" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/>
<text class="t" x="475" y="290" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Terminal (SSH)</text>

<text class="ts" x="340" y="338" fill="#5F5E5A" text-anchor="middle">One core, two thin renderers — write the state logic once.</text>
</svg>
